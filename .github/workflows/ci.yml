name: gfopencurl CI

on:
  push:
  pull_request:

jobs:
  host:
    # curl with patches/, GFOpenTLS's host build and nghttp2, against local
    # HTTPS servers, HTTP/1.1 and HTTP/2 (tests/host/host-test.sh). The Amiga
    # build is build.sh's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GFOpenTLS with TLS 1.3 and the GFOpen names: gfopentls main after #19 (bc509d4).
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopentls
          ref: bc509d410e306369fa39cb91fe94c3d25cf8b228
          path: gfopentls
      - name: Fetch curl and nghttp2 (SOURCES)
        run: |
          mkdir -p tarballs
          curl -fsSL -o tarballs/curl-8.22.0.tar.xz https://curl.se/download/curl-8.22.0.tar.xz
          curl -fsSL -o tarballs/nghttp2-1.70.0.tar.xz https://github.com/nghttp2/nghttp2/releases/download/v1.70.0/nghttp2-1.70.0.tar.xz
          echo "e05cb1388eaca3830aded4ccf20044b6e1ac1a61411dcca11b0437c4285c8bc2  tarballs/nghttp2-1.70.0.tar.xz" | sha256sum -c -
      - name: Host test
        run: OPENTLS_SRC=gfopentls JOBS=4 tests/host/host-test.sh
      - name: Host test with AddressSanitizer and UBSan
        run: OPENTLS_SRC=gfopentls JOBS=4 SANITIZE=1 tests/host/host-test.sh

  amiga:
    # libcurl, nghttp2 and curltest for the 68040 with the GFOpenAmigaGCC
    # release and GFOpenNDK's network headers (tests/amiga/ci-build.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the TLS 1.3 headers, renamed (gfopentls.h): gfopentls main after #19 (bc509d4), as in the host job
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopentls
          ref: bc509d410e306369fa39cb91fe94c3d25cf8b228
          path: gfopentls
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopensdk
          ref: 5bfeaea0d004e86afb990fddb591bf0039f09233
          path: gfopensdk
      - name: Fetch the toolchain, curl, nghttp2 and zlib (SOURCES)
        run: |
          mkdir -p tarballs tc
          U=https://github.com/DalsinAI/gfopengcc/releases/download/v16.2.0-open6
          curl -fsSL -o tc/tc.tar.xz $U/gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz
          echo "65f284476ec20cdf7851475d91d2c18d77fa6f2a0eb0f844b6ca23dbfa57eaa7  tc/tc.tar.xz" | sha256sum -c -
          tar xf tc/tc.tar.xz -C tc
          curl -fsSL -o tarballs/curl-8.22.0.tar.xz https://curl.se/download/curl-8.22.0.tar.xz
          curl -fsSL -o tarballs/zlib-1.3.1.tar.xz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz
          curl -fsSL -o tarballs/nghttp2-1.70.0.tar.xz https://github.com/nghttp2/nghttp2/releases/download/v1.70.0/nghttp2-1.70.0.tar.xz
          echo "e05cb1388eaca3830aded4ccf20044b6e1ac1a61411dcca11b0437c4285c8bc2  tarballs/nghttp2-1.70.0.tar.xz" | sha256sum -c -
      - name: 68040 build
        run: TOOLCHAIN_DIR=tc/gfopenamigagcc-16.2.0-open6-x86_64-linux OPENNDK=gfopensdk/OpenNDK OPENTLS_SRC=gfopentls tests/amiga/ci-build.sh
